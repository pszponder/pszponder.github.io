  </style>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <script>
    let fuse;
    let searchData = [];

    
    fetch('/index.json')
      .then(response => response.json())
      .then(data => {
        searchData = data;
        const options = {
          keys: ['title', 'summary', 'contents', 'tags', 'categories'],
          threshold: 0.3,
          includeScore: true,
          includeMatches: true
        };
        fuse = new Fuse(searchData, options);
      })
      .catch(error => {
        console.error('Error loading search index:', error);
      });

    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    let searchTimeout;

    searchInput.addEventListener('input', function() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        performSearch();
      }, 300);
    });

    function performSearch() {
      const query = searchInput.value.trim();
      
      if (!query) {
        searchResults.innerHTML = '';
        return;
      }

      if (!fuse) {
        searchResults.innerHTML = '<div class="no-results">Search index is still loading...</div>';
        return;
      }

      const results = fuse.search(query);
      
      if (results.length === 0) {
        searchResults.innerHTML = '<div class="no-results">No results found for "' + query + '"</div>';
        return;
      }

      const resultsHtml = results.map(result => {
        const item = result.item;
        const score = Math.round((1 - result.score) * 100);
        
        
        const date = new Date(item.date).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
        
        
        const tagsHtml = item.tags ? item.tags.map(tag => 
          `<a href="/tags/${tag.toLowerCase()}" class="search-result-tag">${tag}</a>`
        ).join('') : '';

        return `
          <div class="search-result">
            <h3><a href="${item.permalink}">${item.title}</a></h3>
            <div class="search-result-meta">${date} • Match: ${score}%</div>
            <div class="search-result-summary">${item.summary}</div>
            ${tagsHtml ? `<div class="search-result-tags">${tagsHtml}</div>` : ''}
          </div>
        `;
      }).join('');

      const statsHtml = `<div class="search-stats">Found ${results.length} result${results.length !== 1 ? 's' : ''} for "${query}"</div>`;
      
      searchResults.innerHTML = statsHtml + resultsHtml;
    }

    
    document.addEventListener('DOMContentLoaded', function() {
      searchInput.focus();
    });
  </script>
